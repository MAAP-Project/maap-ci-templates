stages:
  - build
  - generate

# The MAAP API sends REPOSITORY_URL with a credential placeholder for repos hosted on the MAAP
# GitLab, e.g. https://maap-api-svc:${GITLAB_CLONE_TOKEN}@repo.maap-project.org/group/algo.git,
# because anonymous clones are disabled there. GITLAB_CLONE_TOKEN is a masked project CI variable
# holding the service account's read_repository PAT. The runner normally expands the placeholder
# on its own; this step makes that explicit and fails fast if the token is missing.
# External repos (github.com etc.) arrive without a placeholder and pass through untouched.
.resolve_repository_url:
  script:
    - |
      case "$REPOSITORY_URL" in
        *'${GITLAB_CLONE_TOKEN}'*)
          if [ -z "$GITLAB_CLONE_TOKEN" ]; then
            echo "REPOSITORY_URL requires GITLAB_CLONE_TOKEN but the CI variable is not set" >&2
            exit 1
          fi
          REPOSITORY_URL="$(printf '%s' "$REPOSITORY_URL" | sed "s|\${GITLAB_CLONE_TOKEN}|${GITLAB_CLONE_TOKEN}|g")"
          export REPOSITORY_URL
          ;;
      esac

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$OGC_APP_PACK_DEPLOY_TOKEN" | docker login -u ogc-app-pack-deploy --password-stdin $CI_REGISTRY
  script:
    - echo "IMAGE_NAME = $IMAGE_NAME"
    - echo "IMAGE_TAG = $IMAGE_TAG"
    - export FULLY_QUALIFIED_IMAGE_URL="$OGC_APP_PACK_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
    - docker rmi ${FULLY_QUALIFIED_IMAGE_URL} || true
    - !reference [.resolve_repository_url, script]
    - |
      cat > Dockerfile <<'DOCKERFILE_EOF'
      ARG BASE_IMAGE_NAME=condaforge/miniforge3:25.3.1-0
      FROM ${BASE_IMAGE_NAME}

      ARG REPOSITORY_URL
      ARG BRANCH_REF
      ARG BUILD_CMD='$(echo "NO BUILD CMD SPECIFIFED")'

      # Switch user to root explicitly
      USER root

      RUN mkdir /app

      WORKDIR /app

      # Clone, then drop any credential from the remote URL so it is not left in .git/config
      RUN git clone --depth 1 --single-branch --branch ${BRANCH_REF} ${REPOSITORY_URL} && \
          cd "$(basename "${REPOSITORY_URL}" .git)" && \
          git remote set-url origin "$(printf '%s' "${REPOSITORY_URL}" | sed -E 's#//[^@/]+@#//#')"
      RUN bash ${BUILD_CMD} && conda clean -afy

      CMD ["/bin/bash"]

      DOCKERFILE_EOF
    - |
      docker build --no-cache -t ${FULLY_QUALIFIED_IMAGE_URL} \
                  --build-arg BUILD_CMD=${BUILD_CMD} \
                  --build-arg BASE_IMAGE_NAME=${BASE_IMAGE_NAME} \
                  --build-arg REPOSITORY_URL=${REPOSITORY_URL} \
                  --build-arg BRANCH_REF=${BRANCH_REF} \
                  -f Dockerfile .
    - echo "$OGC_APP_PACK_DEPLOY_TOKEN" | docker login -u ogc-app-pack-deploy --password-stdin $CI_REGISTRY
    - docker push ${FULLY_QUALIFIED_IMAGE_URL}
    - echo "FULLY_QUALIFIED_IMAGE_URL=$FULLY_QUALIFIED_IMAGE_URL" > image.env
  artifacts:
    reports:
      dotenv: image.env

  rules:
    # Allow manual run from UI
    - if: '$CI_PIPELINE_SOURCE == "web" && $FULLY_QUALIFIED_IMAGE_URL == null'
      when: always
    # Allow API trigger
    - if: '$CI_PIPELINE_SOURCE == "api" && $FULLY_QUALIFIED_IMAGE_URL == null'
      when: always
    # Block push or any other source
    - when: never

generate_ogc_app_pack:
  stage: generate
  image: python:3.12
  dependencies:
    - build_image
  timeout: 7 minutes
  before_script:
    - apt-get update && apt-get install -y curl bash
  script:
    - echo "Generating OGC application package for image $FULLY_QUALIFIED_IMAGE_URL"
    - git clone https://github.com/MAAP-Project/ogc-app-pack-generator.git
    - pip install -r ogc-app-pack-generator/requirements.txt
    - |
      python3 - <<'EOF'
      import os
      import base64
      import json
      from ruamel.yaml import YAML

      # Decode base64 → JSON
      data_json = base64.b64decode(os.environ['ALGO_CONFIG_JSON_B64']).decode()

      # Parse JSON
      data = json.loads(data_json)
      # Add /app since we are cloning the code under /app
      data['run_command'] = '/app/' + data['run_command']

      # Write YAML
      yaml = YAML()
      yaml.indent(mapping=2, sequence=4, offset=2)
      with open('algo_config.yaml', 'w') as f:
          yaml.dump(data, f)
      EOF
    - export DOCKER_TAG=$FULLY_QUALIFIED_IMAGE_URL
    - !reference [.resolve_repository_url, script]
    - export GIT_COMMIT_HASH="$(git ls-remote ${REPOSITORY_URL} "refs/heads/${BRANCH_REF}" "refs/tags/${BRANCH_REF}" | awk 'NR==1 {print $1}')"
    - python3 ogc-app-pack-generator/build_cwl_workflow.py --yaml-file algo_config.yaml --cwl-template-file ogc-app-pack-generator/templates/process.v1_2.cwl
    - echo "CWL file generated successfully at cwl_workflows/process.cwl"
    - echo "Publishing process.cwl to GitLab repository (serialized to prevent race conditions)"
    - |
      # Publish process.cwl with retry logic to handle transient failures
      export PROCESS_CWL_FILE_B64=$(cat cwl_workflows/process.cwl | base64 -w 0)

      MAX_RETRIES=3
      RETRY_DELAY=2

      for attempt in $(seq 1 $MAX_RETRIES); do
        echo "Attempt $attempt of $MAX_RETRIES..."

        # Try POST first (create new file) - capture response body AND status code
        response=$(curl -X POST -s -w "\n%{http_code}" --location "${OGC_PROCESS_FILE_PUBLISH_URL}" \
          -H "Content-Type: application/json" \
          --header "PRIVATE-TOKEN: ${OGC_APP_PACK_WRITE_TOKEN}" \
          --data-raw "{\"branch\": \"main\",\"author_email\": \"root@maap-project.org\",\"author_name\": \"Administrator\",\"commit_message\": \"Publish $IMAGE_NAME/$IMAGE_TAG/process.cwl\",\"encoding\": \"base64\",\"content\": \"$PROCESS_CWL_FILE_B64\"}")

        # Extract status code (last line) and body (everything before)
        status_code=$(echo "$response" | tail -n1)
        response_body=$(echo "$response" | head -n-1)

        if [[ "$status_code" != "201" ]]; then
          echo "POST failed with status $status_code and response body $response_body, trying PUT..."
          response=$(curl -X PUT -s -w "\n%{http_code}" --location "${OGC_PROCESS_FILE_PUBLISH_URL}" \
            -H "Content-Type: application/json" \
            --header "PRIVATE-TOKEN: ${OGC_APP_PACK_WRITE_TOKEN}" \
            --data-raw "{\"branch\": \"main\",\"author_email\": \"root@maap-project.org\",\"author_name\": \"Administrator\",\"commit_message\": \"Publish $IMAGE_NAME/$IMAGE_TAG/process.cwl\",\"encoding\": \"base64\",\"content\": \"$PROCESS_CWL_FILE_B64\"}")

          status_code=$(echo "$response" | tail -n1)
          response_body=$(echo "$response" | head -n-1)
        fi

        # Check if successful
        if [[ "$status_code" == "200" ]] || [[ "$status_code" == "201" ]]; then
          echo "Successfully published process.cwl with status $status_code"
          break
        else
          echo "Attempt $attempt failed with status $status_code"
          echo "Response: $response_body"

          if [[ $attempt -lt $MAX_RETRIES ]]; then
            echo "Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          else
            echo "ERROR: All $MAX_RETRIES attempts failed."
            exit 1
          fi
        fi
      done

  artifacts:
    paths:
      - cwl_workflows/*
      - algo_config.yaml

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - when: never
  tags:
    - docker